# 차단이 서비스 단위인가 IP 단위인가 (일회성 진단).
#
# 실거래 수집이 8/24 크론과 8/25 수동 재시도에서 연달아 사전 확인 전부
# ConnectTimeout으로 0건 실패했다. 같은 무렵 대장은 정상이었지만 두 워크플로는
# concurrency 그룹이 같아 겹칠 수 없고 러너도 달라, 아직 갈리지 않은 질문이다.
# 한 잡에서 둘을 같이 두드려야 답이 나온다.
#
# 릴리스 자산을 만지지 않으므로 data-latest 그룹에 넣지 않는다. 대장 크론이
# 도는 중에도 이 진단은 따로 돌 수 있어야 한다. 결론이 나면 지워도 된다.

name: 차단 범위 정찰

on:
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: '1'
  MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python probe_block.py
