# 건축물대장 표제부 수집 → data-latest 릴리스의 bldg.sqlite.gz
# Secrets: MOLIT_SERVICE_KEY (건축물대장 API도 활용신청되어 있어야 한다)
#
# 개발계정 일일 한도가 보통 1만 건이라 서울 전체 98,575건은 한 번에 못 받는다.
# --max-calls로 하루치만 받고 bldg_log에 남겨, 다음 실행이 이어받는다.
#
# 이 API는 초당 한도가 있다. 워커 6개로 풀었더니 1.1초에 25건이 나가서 429를 맞았다.
# 속도는 --rate가 잡고 --workers는 응답 대기를 겹치기만 한다. 429를 맞으면 스스로 느려진다.

name: 건축물대장 수집

on:
  workflow_dispatch:
    inputs:
      lawd:
        description: '자치구 코드 (쉼표 구분, 비우면 서울 전체). 예: 11140'
        default: ''
      max_calls:
        description: '이번 실행 최대 호출 수'
        default: '9000'
      workers:
        description: '동시 호출 수. 응답 대기를 겹치는 용도'
        default: '3'
      rate:
        description: '초당 호출 수 상한. 429가 계속되면 낮춘다'
        default: '2'
      probe:
        description: '진단 모드 — 지번 하나만 호출하고 원 응답 출력'
        type: boolean
        default: false
  schedule:
    # 전체를 다 받을 때까지 매일 새벽에 이어받는다. 다 받으면 즉시 종료된다.
    - cron: '0 18 * * *'

concurrency:
  group: buildings
  cancel-in-progress: false

env:
  # 이게 없으면 파이썬 stdout이 블록 버퍼링돼서 실행 중 로그가 한 줄도 안 보인다.
  # 첫 실행에서 47분을 눈감고 돌린 원인이 이것이었다.
  PYTHONUNBUFFERED: '1'
  MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SNAPSHOT_TAG: data-latest

jobs:
  buildings:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      # 조회 대상은 실거래가 DB에서 뽑으므로 원본 스냅샷이 필요하다.
      - name: 실거래가 스냅샷 복원
        run: |
          gh release download "$SNAPSHOT_TAG" --pattern 'seoul_rt.sqlite.gz' --clobber
          gunzip -f seoul_rt.sqlite.gz

      - name: 건축물대장 진행분 복원
        run: |
          if gh release download "$SNAPSHOT_TAG" --pattern 'bldg.sqlite.gz' --clobber; then
            gunzip -f bldg.sqlite.gz
            python -c "import sqlite3;c=sqlite3.connect('bldg.sqlite');print('복원:', c.execute('SELECT COUNT(*) FROM buildings').fetchone()[0], '동')"
          else
            echo "이전 진행분 없음. 처음부터 받습니다."
          fi

      - name: 건축물대장 수집
        id: collect
        continue-on-error: true
        run: |
          python collect_bldg.py --rt-db seoul_rt.sqlite --db bldg.sqlite \
            --lawd "${{ inputs.lawd }}" --max-calls ${{ inputs.max_calls || 9000 }} \
            --workers ${{ inputs.workers || 3 }} --rate ${{ inputs.rate || 2 }} \
            ${{ inputs.probe && '--probe' || '' }}

      # 한도에 걸려 중간에 끊겨도 받은 만큼은 보존해야 다음 실행이 이어받는다.
      - name: 진행분 발행
        if: always() && hashFiles('bldg.sqlite') != ''
        run: |
          python -c "import sqlite3;c=sqlite3.connect('bldg.sqlite');c.execute('PRAGMA wal_checkpoint(TRUNCATE)');c.close()"
          gzip -kf bldg.sqlite
          ls -lh bldg.sqlite.gz
          gh release upload "$SNAPSHOT_TAG" bldg.sqlite.gz --clobber

      - name: 수집 실패 여부 확인
        if: steps.collect.outcome == 'failure'
        run: |
          echo "수집 단계가 실패했습니다. 위 로그를 확인하세요."
          echo "받은 만큼은 릴리스에 남아 있으므로 재실행하면 이어받습니다."
          exit 1
