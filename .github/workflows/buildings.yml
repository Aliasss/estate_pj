# 건축물대장 표제부 수집 → data-latest 릴리스의 bldg.sqlite.gz
# Secrets: MOLIT_SERVICE_KEY (건축물대장 API도 활용신청되어 있어야 한다)
#
# 개발계정 일일 한도가 보통 1만 건이라 서울 전체 98,575건은 한 번에 못 받는다.
# --max-calls로 하루치만 받고 bldg_log에 남겨, 다음 실행이 이어받는다.
#
# 이 API는 초당 한도가 있다. 워커 6개로 풀었더니 1.1초에 25건이 나가서 429를 맞았고,
# 한 번 걸리자 38분 넘게 접속 자체가 막혔다(429가 아니라 ConnectTimeout으로 온다).
# 속도는 --rate가 잡고 --workers는 응답 대기를 겹치기만 한다.
# 시작 전에 한 건을 먼저 쏴 보므로, 막혀 있으면 15초 만에 알고 끝난다.

name: 건축물대장 수집

on:
  workflow_dispatch:
    inputs:
      lawd:
        description: '자치구 코드 (쉼표 구분, 비우면 서울 전체). 예: 11140'
        default: ''
      max_calls:
        description: '이번 실행 최대 호출 수'
        # 9,000에서 내렸다. 22시 시작 회차는 자정을 걸치므로 하루 쿼터(1만)를
        # 어제 실행의 새벽 꼬리와 나눠 쓴다. 9,000이면 페이지·재시도까지 합쳐
        # 상한에 딱 붙고, 실제로 8/15 밤 정기 1회차가 2,490건 만에 429 절벽을
        # 맞았다(전날 수동 실행 꼬리 약 6,700건 + 당일분). 8,000이면 여유가 남는다.
        default: '8000'
      workers:
        description: '동시 호출 수. 응답 대기를 겹치는 용도'
        default: '2'
      rate:
        description: '초당 호출 수 상한. 429가 계속되면 낮춘다'
        default: '1'
      probe:
        description: '진단 모드. 지번 하나만 호출하고 원 응답 출력'
        type: boolean
        default: false
  schedule:
    # 전체를 다 받을 때까지 매일 이어받는다. 다 받으면 즉시 종료된다.
    # 13:00 UTC = 22:00 KST. 시간대 이동 이력: 03:00 KST는 심야 접속 거부,
    # 09:00 KST는 8/13·8/14 이틀 연속 ConnectTimeout으로 실측 탈락. 저녁대는
    # 8/12 인구 수집(20:26~22:15)과 8/14 22:53 수동 재실행(9,000호출 완주)로
    # 실측 검증됐다. 22시 시작이면 최장 회차(4시간 13분 실측)도 새벽 2시대에
    # 끝나 심야 거부 창을 피한다. 또 막히면 이 이력에 한 줄 보태고 성공이
    # 실측된 창으로 옮길 것.
    - cron: '0 13 * * *'

# collect.yml과 같은 그룹. 둘 다 data-latest 릴리스 자산을 만지므로 겹치면
# 한쪽의 --clobber 창에 다른 쪽 다운로드가 걸려 깨진다. 같은 그룹이면 GitHub이
# 직렬화한다(둘이 겹치는 시각이면 늦게 온 쪽이 대기 후 실행).
concurrency:
  group: data-latest
  cancel-in-progress: false

env:
  # 이게 없으면 파이썬 stdout이 블록 버퍼링돼서 실행 중 로그가 한 줄도 안 보인다.
  # 첫 실행에서 47분을 눈감고 돌린 원인이 이것이었다.
  PYTHONUNBUFFERED: '1'
  MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SNAPSHOT_TAG: data-latest

jobs:
  buildings:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      # 조회 대상은 실거래가 DB에서 뽑으므로 원본 스냅샷이 필요하다. 스냅샷이
      # 정말 없으면(최초, collect.yml이 아직 안 돈 상태) 오늘은 할 일이 없는
      # 것이지 실패가 아니다. 매일 빨간 런이 쌓이면 진짜 실패가 묻힌다.
      - name: 실거래가 스냅샷 복원
        id: rt
        run: |
          if assets=$(gh release view "$SNAPSHOT_TAG" --json assets --jq '.assets[].name' 2>&1); then
            if echo "$assets" | grep -qx 'seoul_rt.sqlite.gz'; then
              # 에셋이 분명히 있다. 여기서 실패하면 일시 오류이므로 중단한다.
              gh release download "$SNAPSHOT_TAG" --pattern 'seoul_rt.sqlite.gz' --clobber
              gunzip -f seoul_rt.sqlite.gz
              echo "has_rt=true" >> "$GITHUB_OUTPUT"
            else
              echo "원본 스냅샷 에셋이 아직 없습니다. collect.yml이 먼저 돌면 생깁니다."
              echo "has_rt=false" >> "$GITHUB_OUTPUT"
            fi
          elif echo "$assets" | grep -qiE 'not found|404'; then
            echo "릴리스가 아직 없습니다(최초 실행 전). 오늘은 할 일이 없습니다."
            echo "has_rt=false" >> "$GITHUB_OUTPUT"
          else
            echo "릴리스 확인 자체가 실패했습니다(일시 오류)."; echo "$assets"; exit 1
          fi

      # "에셋이 정말 없음"과 "다운로드 실패"를 구분한다. 일시 오류를 '처음부터'로
      # 삼키면 며칠치 진행분이 이번 실행의 하루치로 덮여 갈려 나간다.
      - name: 건축물대장 진행분 복원
        if: steps.rt.outputs.has_rt == 'true'
        run: |
          assets=$(gh release view "$SNAPSHOT_TAG" --json assets --jq '.assets[].name')
          if echo "$assets" | grep -qx 'bldg.sqlite.gz'; then
            # 에셋이 분명히 있다. 여기서 실패하면 일시 오류이므로 중단한다.
            gh release download "$SNAPSHOT_TAG" --pattern 'bldg.sqlite.gz' --clobber
            gunzip -f bldg.sqlite.gz
            python -c "import sqlite3;c=sqlite3.connect('bldg.sqlite');print('복원:', c.execute('SELECT COUNT(*) FROM buildings').fetchone()[0], '동')"
            sqlite3 bldg.sqlite "SELECT COUNT(*) FROM buildings" > .rows_before
          else
            echo "이전 진행분 없음. 처음부터 받습니다."
            echo 0 > .rows_before
          fi

      - name: 법정동코드 공식 매핑 내려받기
        if: steps.rt.outputs.has_rt == 'true'
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
        run: |
          # 실패해도 수집은 계속한다. payload 매핑이 대비책이고, 활용신청 승인이
          # 아직이면 여기서 오류가 난다. 승인되면 다음 크론부터 조용히 켜진다.
          python fetch_bjdong.py --out bjdong.json || echo "공식 매핑 없이 진행 (payload 매핑 사용)"

      - name: 건축물대장 수집
        id: collect
        if: steps.rt.outputs.has_rt == 'true'
        continue-on-error: true
        env:
          # dispatch 입력을 셸에 직접 보간하지 않는다. env를 거치면 셸 입장에서
          # 값일 뿐이라 명령으로 해석될 표면이 사라진다.
          IN_LAWD: ${{ inputs.lawd }}
          IN_MAX_CALLS: ${{ inputs.max_calls }}
          IN_WORKERS: ${{ inputs.workers }}
          IN_RATE: ${{ inputs.rate }}
          IN_PROBE: ${{ inputs.probe == true && '1' || '' }}
        run: |
          python collect_bldg.py --rt-db seoul_rt.sqlite --db bldg.sqlite \
            --lawd "$IN_LAWD" --max-calls "${IN_MAX_CALLS:-8000}" \
            --workers "${IN_WORKERS:-2}" --rate "${IN_RATE:-1}" \
            ${IN_PROBE:+--probe}

      # 한도에 걸려 중간에 끊겨도 받은 만큼은 보존해야 다음 실행이 이어받는다.
      - name: 진행분 발행
        if: always() && hashFiles('bldg.sqlite') != ''
        run: |
          # 행 수 가드: 복원 시점보다 줄어든 DB로 진행분을 덮어쓰지 않는다.
          if [ ! -f .rows_before ]; then
            echo "복원 기준(.rows_before)이 없습니다. 복원 단계가 깨진 채 왔으므로 발행하지 않습니다."
            exit 1
          fi
          before=$(cat .rows_before)
          after=$(sqlite3 bldg.sqlite "SELECT COUNT(*) FROM buildings")
          if [ "$after" -lt "$before" ]; then
            echo "buildings 행 수가 ${before} -> ${after}로 줄었습니다. 발행을 거부합니다."
            exit 1
          fi
          echo "행 수 가드 통과: ${before} -> ${after}"
          python -c "import sqlite3;c=sqlite3.connect('bldg.sqlite');c.execute('PRAGMA wal_checkpoint(TRUNCATE)');c.close()"
          gzip -kf bldg.sqlite
          ls -lh bldg.sqlite.gz
          gh release upload "$SNAPSHOT_TAG" bldg.sqlite.gz --clobber

      - name: 수집 실패 여부 확인
        if: steps.collect.outcome == 'failure'
        run: |
          echo "수집 단계가 실패했습니다. 위 로그를 확인하세요."
          echo "받은 만큼은 릴리스에 남아 있으므로 재실행하면 이어받습니다."
          exit 1
