# 건축물대장 표제부 수집 → data-latest 릴리스의 bldg.sqlite.gz
# Secrets: MOLIT_SERVICE_KEY (건축물대장 API도 활용신청되어 있어야 한다)
#
# 개발계정 일일 한도가 보통 1만 건이라 서울 전체 98,575건은 한 번에 못 받는다.
# --max-calls로 하루치만 받고 bldg_log에 남겨, 다음 실행이 이어받는다.
#
# 이 API는 초당 한도가 있다. 워커 6개로 풀었더니 1.1초에 25건이 나가서 429를 맞았고,
# 한 번 걸리자 38분 넘게 접속 자체가 막혔다(429가 아니라 ConnectTimeout으로 온다).
# 속도는 --rate가 잡고 --workers는 응답 대기를 겹치기만 한다.
# 시작 전에 한 건을 먼저 쏴 본다. 한 번에 통하면 몇 초, 막혀 있으면 1분 간격으로
# 세 번까지 다시 확인하고 최대 약 3분 만에 포기한다(collect_bldg.py PREFLIGHT_*).
# 오래 기다리지 않는 이유는 차단이 IP 단위라 같은 잡에서는 풀리지 않기 때문이다.
# 한 번 두드리고 포기하던 시절에 크론이 사흘 연속 하루치를 통째로 버렸다.

name: 건축물대장 수집

on:
  workflow_dispatch:
    inputs:
      lawd:
        description: '자치구 코드 (쉼표 구분, 비우면 서울 전체). 예: 11140'
        default: ''
      max_calls:
        description: '이번 실행 최대 호출 수'
        # 일일 쿼터 1만 기준. 실패 1건은 최대 4요청이므로 실패율 약 4%까지
        # 흡수한다.
        #
        # "1콜/초라 8,000이면 약 133분, 자정 이후 꼬리는 약 800콜"이라고 적혀
        # 있었다. 133분은 재시도도 throttle 후퇴도 없는 하한이지 예상치가
        # 아니었다. 실측은 그 2.3배다. 8/22 회차(run 32) 수집 스텝이 13:23:41Z
        # ~18:35:00Z, 5시간 11분이었다. KST로 22:23~03:35이라 창의 69%가 자정
        # 이후에 있었다. 꼬리는 800콜이 아니라 그날 받은 것의 대부분이다.
        #
        # 그러므로 상한 8,000은 "그날 쿼터 안에 끝난다"가 아니라 "이틀 쿼터에
        # 걸쳐 8,000을 받는다"로 읽어야 한다. 8/15 밤 정기 1회차가 2,490건 만에
        # 429 절벽을 맞은 것도 이 겹침으로 설명된다. 자정 이후 몫이 얼마인지는
        # 로그를 세야 알 수 있고 아직 안 셌다. 상한을 다시 올리려면 그것부터
        # 실측할 것.
        #
        # 8,000과 9,000 사이를 두 번 왕복했다. 기록을 남긴다.
        #  - 9,000은 페이지·재시도까지 합쳐 상한 1만에 딱 붙는다. 8/15 밤 정기
        #    1회차가 2,490건 만에 429 절벽을 맞았다(전날 수동 실행 꼬리 약
        #    6,700건 + 당일분). 그래서 8/15에 8,000으로 내렸다.
        #  - 8/16 밤에 9,000으로 되돌렸고, 8/17 크론이 또 실패했다. 8,000으로
        #    돌아온다. 완주가 며칠 늦는 것보다 매일 0건이 훨씬 비싸다.
        # 이 쿼터일과 다음 날 오전에는 수동 실행을 겹치지 말 것. 겹치면 다음 날
        # 크론이 쿼터를 미리 먹은 상태로 시작한다. 사흘 연속 그렇게 했다.
        #
        # 아래 실행 줄의 셸 기본값(IN_MAX_CALLS:-8000)과 같은 값이어야 한다.
        # 크론은 inputs가 비어 오므로 실제로 쓰이는 것은 그쪽이다.
        default: '8000'
      workers:
        description: '동시 호출 수. 응답 대기를 겹치는 용도'
        default: '2'
      rate:
        description: '초당 호출 수 상한. 429가 계속되면 낮춘다'
        default: '1'
      probe:
        description: '진단 모드. 지번 하나만 호출하고 원 응답 출력'
        type: boolean
        default: false
  schedule:
    # 전체를 다 받을 때까지 매일 이어받는다. 다 받으면 즉시 종료된다.
    # 13:07 UTC = 22:07 KST. 시간대 이동 이력: 03:00 KST는 심야 접속 거부,
    # 09:00 KST는 8/13·8/14 이틀 연속 ConnectTimeout으로 실측 탈락. 저녁대는
    # 8/12 인구 수집(20:26~22:15)과 8/14 22:53 수동 실행(9,000호출 완주)으로
    # 실측 검증됐다.
    #
    # 여기 "22시 시작이면 최장 회차(4시간 13분 실측)도 새벽 2시대에 끝나 심야
    # 거부 창을 피한다"고 적혀 있었는데, 실측이 반박했다. 최장은 4시간 13분이
    # 아니라 5시간 15분이다(8/22 run 32, 잡 13:22:40Z~18:37:30Z = KST
    # 22:22~03:37). 8/25 회차도 03:14 KST에 끝났다. 둘 다 03시대에 걸치고도
    # 성공했다. "심야 거부 창"이라는 전제는 지금 실측으로 뒷받침되지 않는다.
    # 22시대를 유지하는 근거는 09시대와 03시대 시작이 실측으로 탈락했다는
    # 것뿐이고, 종료 시각이 아니다.
    #
    # 8/15·8/16·8/17 세 번 연속 실패했다. 그때는 시각을 안 옮겼다. 세 번 다
    # 사전 확인 ConnectTimeout 한 번에 죽은 것이고, 뒤이은 수동 실행은 같은
    # API로 통과했다. 당시엔 "15~57분 뒤에 회복됐다"고 읽었는데, 8/25 정찰이
    # 그 해석을 반증했다. 수동 실행은 늘 새 잡이고 새 IP다. 차단은 시간이
    # 아니라 IP에 걸리므로 회복된 것이 아니라 IP가 바뀐 것이었다.
    #
    # 8/28 밤, 분만 07로 옮겼다. 시간대는 그대로다. 이번 이유는 국토부가
    # 아니라 깃허브 쪽이다. 예약 실행이 예약 시각에 안 들어온다. 13:00 크론을
    # 쓴 8/15~8/27 열세 회차의 실제 시작(created_at) 지연은 이렇다.
    #
    #   8/15 +21분  8/16 +21분  8/17 +30분  8/18 +33분  8/19 +34분
    #   8/20 +36분  8/21 +35분  8/22 +22분  8/23 +23분  8/24 +40분
    #   8/25 +38분  8/26 +43분
    #   8/27 +9시간 39분(22:39:49Z 시작, 완주 성공)
    #   8/28 16:20Z(=8/29 01:20 KST)까지 미시작
    #
    # 정시 시작은 열세 번 중 0회다. 다만 지각이 두 부류라는 것을 섞지 말 것.
    #
    #  가. 20~43분 상시 지각. 열두 회차 전부. 데이터 손실은 없다.
    #  나. 8/27의 9시간 39분과 8/28 누락. 손실 위험은 이쪽에만 있다.
    #
    # 분을 옮겨서 완화될 개연성이 있는 것은 (가)뿐이다. 깃허브는 예약 실행을
    # 정각에 몰린 큐에 넣으므로 정각을 피하는 것이 문서화된 정석 대응이다.
    # 그런데 이 저장소 데이터로는 정각 가설을 확증할 수 없다. collect.yml의
    # 21:00 UTC 예약 회차도 8/10 +42분, 8/17 +26분, 8/24 +30분으로 폭이 같은데
    # 그쪽도 분이 00이라 둘을 가를 수 없다. 즉 이 변경은 진단이 아니라 실험이다.
    #
    # (나)는 이 변경으로 안 잡힐 가능성이 크다. concurrency 대기는 아니다.
    # 37회차 전부 created_at == run_started_at이고, 대기 취소였다면 cancelled
    # run이 남는데(8/9 run 15가 그렇다) 8/27·8/28에는 run 자체가 없다. 60일
    # 비활성 규칙도 아니다. 남는 설명은 예약 이벤트의 지연 전달 또는 유실이고,
    # 그에 대한 대책은 시각이 아니라 아래 종료 조건이다.
    #
    # 종료 조건: 9/4까지 일곱 회차 중 두 번 이상 +2시간을 넘거나 누락되면,
    # 예약 실행에 기대는 것을 접고 외부에서 workflow_dispatch를 부르는 쪽으로
    # 옮긴다. 그때는 "오늘 이미 받았으면 즉시 종료" 가드를 bldg_log 기준으로
    # 먼저 세울 것. 안 그러면 8,000 x 2회가 일일 쿼터 1만을 넘겨 8/15 절벽을
    # 재현한다.
    - cron: '7 13 * * *'

# collect.yml과 같은 그룹. 둘 다 data-latest 릴리스 자산을 만지므로 겹치면
# 한쪽의 --clobber 창에 다른 쪽 다운로드가 걸려 깨진다. 같은 그룹이면 GitHub이
# 직렬화한다(둘이 겹치는 시각이면 늦게 온 쪽이 대기 후 실행).
concurrency:
  group: data-latest
  cancel-in-progress: false

env:
  # 이게 없으면 파이썬 stdout이 블록 버퍼링돼서 실행 중 로그가 한 줄도 안 보인다.
  # 첫 실행에서 47분을 눈감고 돌린 원인이 이것이었다.
  PYTHONUNBUFFERED: '1'
  MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SNAPSHOT_TAG: data-latest

jobs:
  buildings:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      # 조회 대상은 실거래가 DB에서 뽑으므로 원본 스냅샷이 필요하다. 스냅샷이
      # 정말 없으면(최초, collect.yml이 아직 안 돈 상태) 오늘은 할 일이 없는
      # 것이지 실패가 아니다. 매일 빨간 런이 쌓이면 진짜 실패가 묻힌다.
      - name: 실거래가 스냅샷 복원
        id: rt
        run: |
          if assets=$(gh release view "$SNAPSHOT_TAG" --json assets --jq '.assets[].name' 2>&1); then
            if echo "$assets" | grep -qx 'seoul_rt.sqlite.gz'; then
              # 에셋이 분명히 있다. 여기서 실패하면 일시 오류이므로 중단한다.
              gh release download "$SNAPSHOT_TAG" --pattern 'seoul_rt.sqlite.gz' --clobber
              gunzip -f seoul_rt.sqlite.gz
              echo "has_rt=true" >> "$GITHUB_OUTPUT"
            else
              echo "원본 스냅샷 에셋이 아직 없습니다. collect.yml이 먼저 돌면 생깁니다."
              echo "has_rt=false" >> "$GITHUB_OUTPUT"
            fi
          elif echo "$assets" | grep -qiE 'not found|404'; then
            echo "릴리스가 아직 없습니다(최초 실행 전). 오늘은 할 일이 없습니다."
            echo "has_rt=false" >> "$GITHUB_OUTPUT"
          else
            echo "릴리스 확인 자체가 실패했습니다(일시 오류)."; echo "$assets"; exit 1
          fi

      # "에셋이 정말 없음"과 "다운로드 실패"를 구분한다. 일시 오류를 '처음부터'로
      # 삼키면 며칠치 진행분이 이번 실행의 하루치로 덮여 갈려 나간다.
      - name: 건축물대장 진행분 복원
        if: steps.rt.outputs.has_rt == 'true'
        run: |
          assets=$(gh release view "$SNAPSHOT_TAG" --json assets --jq '.assets[].name')
          if echo "$assets" | grep -qx 'bldg.sqlite.gz'; then
            # 에셋이 분명히 있다. 여기서 실패하면 일시 오류이므로 중단한다.
            gh release download "$SNAPSHOT_TAG" --pattern 'bldg.sqlite.gz' --clobber
            gunzip -f bldg.sqlite.gz
            python -c "import sqlite3;c=sqlite3.connect('bldg.sqlite');print('복원:', c.execute('SELECT COUNT(*) FROM buildings').fetchone()[0], '동')"
            sqlite3 bldg.sqlite "SELECT COUNT(*) FROM buildings" > .rows_before
            # 진행분은 둘이다. 빈 응답 지번은 buildings 행을 절대 안 늘리고
            # bldg_log에만 status='empty'로 남는데, 그 지번이 다음 회차 계획에서
            # 빠지는 유일한 수단이 이 로그다. 이것을 버리면 같은 슬라이스를 매일
            # 다시 조회하고 수집이 영영 안 끝난다.
            sqlite3 bldg.sqlite "SELECT COUNT(*) FROM bldg_log" > .log_before \
              2>/dev/null || echo 0 > .log_before
          else
            echo "이전 진행분 없음. 처음부터 받습니다."
            echo 0 > .rows_before
            echo 0 > .log_before
          fi

      - name: 법정동코드 공식 매핑 내려받기
        if: steps.rt.outputs.has_rt == 'true'
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
        run: |
          # 실패해도 수집은 계속한다. payload 매핑이 대비책이고, 활용신청 승인이
          # 아직이면 여기서 오류가 난다. 승인되면 다음 크론부터 조용히 켜진다.
          python fetch_bjdong.py --out bjdong.json || echo "공식 매핑 없이 진행 (payload 매핑 사용)"

      - name: 건축물대장 수집
        id: collect
        if: steps.rt.outputs.has_rt == 'true'
        continue-on-error: true
        env:
          # dispatch 입력을 셸에 직접 보간하지 않는다. env를 거치면 셸 입장에서
          # 값일 뿐이라 명령으로 해석될 표면이 사라진다.
          IN_LAWD: ${{ inputs.lawd }}
          IN_MAX_CALLS: ${{ inputs.max_calls }}
          IN_WORKERS: ${{ inputs.workers }}
          IN_RATE: ${{ inputs.rate }}
          IN_PROBE: ${{ inputs.probe == true && '1' || '' }}
        run: |
          python collect_bldg.py --rt-db seoul_rt.sqlite --db bldg.sqlite \
            --lawd "$IN_LAWD" --max-calls "${IN_MAX_CALLS:-8000}" \
            --workers "${IN_WORKERS:-2}" --rate "${IN_RATE:-1}" \
            ${IN_PROBE:+--probe}

      # 한도에 걸려 중간에 끊겨도 받은 만큼은 보존해야 다음 실행이 이어받는다.
      - name: 진행분 발행
        if: always() && hashFiles('bldg.sqlite') != ''
        run: |
          # 행 수 가드: 복원 시점보다 줄어든 DB로 진행분을 덮어쓰지 않는다.
          if [ ! -f .rows_before ]; then
            echo "복원 기준(.rows_before)이 없습니다. 복원 단계가 깨진 채 왔으므로 발행하지 않습니다."
            exit 1
          fi
          before=$(cat .rows_before)
          after=$(sqlite3 bldg.sqlite "SELECT COUNT(*) FROM buildings")
          if [ "$after" -lt "$before" ]; then
            echo "buildings 행 수가 ${before} -> ${after}로 줄었습니다. 발행을 거부합니다."
            exit 1
          fi
          # 아무것도 안 늘었으면 올릴 것이 없다. collect.yml의 스냅샷 발행과 같은
          # 가드다. 접속이 막혀 0건으로 끝난 날에도 --clobber로 자산을 갈아 끼우면
          # 자산이 잠깐 없는 창이 이유 없이 한 번 더 열린다.
          #
          # 반드시 두 진행분을 다 본다. buildings 행만 보면 빈 응답 지번(bldg_log에
          # status='empty'로만 남는다)을 통째로 버리게 되고, 그 지번이 계획에서
          # 빠지지 않아 같은 슬라이스를 매일 다시 조회한다. 잔여가 빈 응답만 남는
          # 순간부터는 수집이 영영 안 끝나고 경기 착수가 계속 밀린다.
          logbefore=$(cat .log_before 2>/dev/null || echo 0)
          logafter=$(sqlite3 bldg.sqlite "SELECT COUNT(*) FROM bldg_log")
          if [ "$after" -eq "$before" ] && [ "$logafter" -eq "$logbefore" ]; then
            echo "새로 적재된 동도, 새로 조회한 지번도 없습니다(${before}동). 자산은 그대로 둡니다."
            exit 0
          fi
          echo "조회 지번 ${logbefore} -> ${logafter}"
          echo "행 수 가드 통과: ${before} -> ${after}"
          python -c "import sqlite3;c=sqlite3.connect('bldg.sqlite');c.execute('PRAGMA wal_checkpoint(TRUNCATE)');c.close()"
          gzip -kf bldg.sqlite
          ls -lh bldg.sqlite.gz
          gh release upload "$SNAPSHOT_TAG" bldg.sqlite.gz --clobber

      # 대장은 매일 쌓이는데 물건에 붙이는 것은 build_units.py이고, 그건 collect.yml
      # (주간)에서만 돌았다. 그래서 최대 일주일치가 릴리스에만 있고 화면에는 없었다.
      # 8/19 빌드 이후 세 회차가 쌓은 31,899동이 안 붙어 있었고, 서초·강남·송파·강동은
      # 대장을 다 받아 놓고도 화면에서 0%였다. 그 회차에 이어서 붙인다.
      #
      # 큰 자산 둘(seoul_rt 1.1GB, bldg)은 이 잡이 이미 복원해 두었다. 여기서 더
      # 받는 것은 좌표·지하철 8.4MB와 직전 units 30MB뿐이다. 실측으로 아는 것은
      # collect.yml 32536101286의 물건 패널 발행 스텝 23:20:30~23:22:40, 2분 10초다.
      # 여기는 거기에 재료 내려받기와 발행 가드가 더 붙으므로 그보다 걸린다.
      # 실제 스텝 시간은 첫 회차 로그를 보고 이 자리에 적는다.
      - name: 재조인 필요 여부 판단
        id: need
        # bldg.sqlite는 진행분 복원에서도 생긴다. 스냅샷이 없어 수집을 건너뛴 날엔
        # seoul_rt.sqlite가 없으므로 재조인이 build_units 앞에서 죽는다.
        # always()는 수집이 부분 실패한 날에도 받은 만큼 붙이려는 것이다. 앞의
        # 발행이 exit 1로 죽은 날은 잡이 failure가 되어 mats가 암묵 success()로
        # 걸러 주므로, 여기서 stale=true가 나가도 뒤가 안 돈다.
        if: always() && steps.rt.outputs.has_rt == 'true' && hashFiles('bldg.sqlite') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # "오늘 늘었나"가 아니라 "units가 대장보다 낡았나"를 본다. 앞의 조건은 대장이
          # 완주한 뒤 영구히 false가 되어, 마지막 증분이 주간 배치까지 안 붙는다.
          meta=$(gh release view "$SNAPSHOT_TAG" --json assets \
                 -q '.assets[] | select(.name=="units.tar.gz" or .name=="bldg.sqlite.gz")
                     | .name + " " + .createdAt' || true)
          u=$(echo "$meta" | awk '$1=="units.tar.gz"{print $2}')
          b=$(echo "$meta" | awk '$1=="bldg.sqlite.gz"{print $2}')
          echo "units=$u bldg=$b"
          if [ -z "$u" ] || [ -z "$b" ]; then
            echo "::warning::릴리스 자산 시각을 읽지 못해 재조인을 건너뜁니다."
            exit 0
          fi
          if [ "$u" \< "$b" ]; then
            echo "units가 대장보다 낡았습니다. 재조인합니다."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "units가 이미 최신입니다."
          fi

      - name: 재조인 재료 복원
        id: mats
        if: steps.need.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for a in geo.sqlite.gz subway.json schools.json units.tar.gz; do
            gh release download "$SNAPSHOT_TAG" --pattern "$a" --clobber || echo "$a 없음"
          done
          if [ -f geo.sqlite.gz ]; then gunzip -f geo.sqlite.gz; fi

          # 좌표와 역 자료가 없으면 lat·lon부터 통근·학교·지형까지 통째로 빠진 units가
          # 나온다(subway_join.py의 ready가 둘을 함께 본다). 지금 릴리스는 좌표가
          # 99.6~100%인데 그것을 0%로 덮으면 지도와 내 주변이 죽고, --clobber라
          # 되돌릴 것도 안 남는다. 없으면 아예 만들지 않는다.
          #
          # schools.json은 여기 넣지 않는다. 그 자산은 지금 릴리스에 아예 없다
          # (활용신청이 데이터셋마다 따로라 sources.yml의 학교 수집이 매번
          # continue-on-error로 조용히 실패한다). 필수로 올리면 재조인이 매번
          # 접혀 이 변경 전체가 무력화된다. 학교는 아래 발행 가드가 index.json의
          # sch_hit으로 잡는다.
          for f in geo.sqlite subway.json; do
            if [ ! -f "$f" ]; then
              echo "::warning::$f 가 없어 재조인을 건너뜁니다. 좌표·통근·학교·지형이"
              echo "::warning::통째로 빠진 units로 릴리스를 덮어쓸 수 없습니다."
              exit 0
            fi
          done

          # 실거래 스냅샷은 주간이라 달력이 그것을 앞지르는 달이 있다. 9월 5일이면
          # 달력은 202607을 확정으로 여는데 그때 스냅샷은 9월 1일 수집분이라 나흘치
          # 신고가 빠져 있다. 직전 units가 확정으로 삼은 달을 상한으로 넘겨 거기서
          # 멈춘다. 그러므로 상한을 못 얻으면 재조인 자체를 접는다. 상한 없이 돌면
          # 얇은 달이 확정 통계로 나가고, 이 앱은 표본 두께를 그 자체로 위험 신호로
          # 화면에 낸다. geo·subway와 같은 등급의 필수 재료다.
          if [ ! -f units.tar.gz ]; then
            echo "::warning::직전 units를 못 받아 확정월 상한을 정할 수 없습니다."
            echo "::warning::상한 없이 재조인하면 얇은 달이 확정으로 나갑니다. 건너뜁니다."
            exit 0
          fi
          # 아카이브는 `tar -czf ... -C units .`로 만들어져 멤버 이름이 './index.json'
          # 이다. './' 없이 부르면 "Not found in archive"로 죽는다. 디스크에 풀지
          # 않는 이유는 build_units가 out_dir을 비우지 않아서다. 옛 파일이 남으면
          # 이번 회차에 없는 구가 옛 build 표식을 단 채 tar에 실린다.
          meta=$(tar -xzOf units.tar.gz ./index.json | python -c "
          import json, sys
          d = json.load(sys.stdin)
          print(d['window'][1], d.get('bldg_rows', -1), d.get('sch_hit', -1))") || {
            echo "::warning::직전 units의 index.json을 못 읽었습니다. 재조인을 건너뜁니다."
            exit 0
          }
          read -r end was sch_was <<< "$meta"
          # 숫자가 아닌 값이 들어오면 뒤의 [ -ge ] 비교가 stderr 소음을 낸다.
          # 동작은 안전한 방향(재조인 진행)이지만 로그가 지저분해진다.
          case "$was" in ''|*[!0-9-]*) was=-1 ;; esac
          case "$sch_was" in ''|*[!0-9-]*) sch_was=-1 ;; esac
          case "$end" in
            [0-9][0-9][0-9][0-9][0-9][0-9]) ;;
            *) echo "::warning::확정월이 YYYYMM이 아닙니다. 재조인을 건너뜁니다."; exit 0 ;;
          esac

          # 붙일 것이 새로 생겼는지는 자산 시각이 아니라 내용으로 판단한다. 위
          # 발행 가드가 bldg_log도 보게 되면서, 빈 응답만 있던 날에도 대장 자산이
          # 움직인다. 시각으로 보면 그런 날마다 재조인이 돌아 내용이 같은 units를
          # 다시 굽고, build_id가 바뀌어 캐시를 든 사용자에게 "데이터가 갱신되었습니다"가
          # 뜬다. 직전 units가 어느 세대 대장으로 구워졌는지는 index.json의
          # bldg_rows에 있다. 표식이 없는 옛 아카이브는 -1이라 한 번 재조인하고 생긴다.
          # 이 줄만 실패 시 스텝을 죽인다(다른 실패 경로는 warning + exit 0).
          # 파일 존재는 need가 hashFiles로 보장했으므로 여기서 죽는 경우는 DB 손상뿐이고,
          # 그건 조용히 건너뛸 일이 아니라 그날 안에 알아야 할 일이다.
          now=$(sqlite3 bldg.sqlite "SELECT COUNT(*) FROM buildings")
          echo "직전 확정월 $end · 직전 units의 대장 ${was}동 · 지금 ${now}동"
          if [ "$was" -ge 0 ] && [ "$was" -eq "$now" ]; then
            echo "직전 units가 이미 이 대장으로 구워졌습니다. 재조인할 것이 없습니다."
            exit 0
          fi
          echo "complete_end=$end" >> "$GITHUB_OUTPUT"
          echo "sch_was=$sch_was" >> "$GITHUB_OUTPUT"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: 물건 패널 재조인·발행
        id: rejoin
        if: steps.mats.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAP: ${{ steps.mats.outputs.complete_end }}
          SCH_WAS: ${{ steps.mats.outputs.sch_was }}
        run: |
          # 없는 파일은 build_units가 os.path.exists로 걸러 내고 안내를 찍는다.
          python build_units.py --db seoul_rt.sqlite --out units \
            --bldg bldg.sqlite --geo geo.sqlite --subway subway.json \
            --schools schools.json ${CAP:+--complete-end "$CAP"}

          # 발행 전 가드. 좌표가 크게 줄었으면 무언가 잘못된 것이라 덮어쓰지 않는다.
          lat=$(python -c "
          import json, glob, os
          n = h = 0
          for f in glob.glob('units/[0-9]*.json'):
              g = json.load(open(f))
              if 'lat' not in g['cols']: continue
              k = g['cols'].index('lat')
              for r in g['rows']:
                  n += 1
                  h += r[k] is not None
          print(round(h / n * 100) if n else 0)")
          echo "새 units 좌표 보유율 ${lat}%"
          if [ "$lat" -lt 90 ]; then
            echo "좌표 보유율이 ${lat}%로 낮습니다. 발행을 거부합니다."
            exit 1
          fi

          # 대장 결합률 후퇴는 아무도 안 보고 있었다. bldg.sqlite에 행은 있는데
          # Registry가 스키마 드리프트로 한 동도 못 붙이는 경우가 그대로 통과한다.
          # 열은 남아 스키마가 안 깨지고 좌표 가드도 안 걸린다.
          #
          # 서울(finder-11)끼리 직전과 비교한다. 경기를 섞으면 대장 미착수 지역이
          # 분모에 들어와 정상인 날에도 걸린다. 대장은 append 전용이고 창은 상한으로
          # 고정돼 있으니 정상 경로에서는 절대 안 걸린다.
          ratio() {
            python -c "
          import json, sys
          g = json.load(sys.stdin)
          c = dict(zip(g['cols'], g['columns'])).get('elvt')
          print(round(sum(x is not None for x in c) / len(c) * 100) if c else -1)"
          }
          now=$(ratio < units/finder-11.json)
          was=$(tar -xzOf units.tar.gz ./finder-11.json | ratio) || was=-1
          echo "서울 대장 결합률 직전 ${was}% -> 새 ${now}%"
          if [ "$was" -ge 0 ] && [ "$now" -lt "$((was - 1))" ]; then
            echo "대장 결합률이 후퇴했습니다. 발행을 거부합니다."
            exit 1
          fi

          # 학교는 finder에 열이 없다. FINDER_COLS(build_units.py)가 sch_*를 안 담고
          # 구별 상세 파일에만 있어서, finder로 재려 하면 열이 없어 -1이 나오고 가드가
          # 조용히 꺼진다. 실제로 그렇게 만들었다가 잡혔다. 대신 build_units가
          # index.json에 남기는 sch_hit(학교 값을 실제로 받은 물건 수)을 본다.
          # 지금은 0이라 0 -> 0으로 통과하고, 활용신청이 승인돼 schools.json 자산이
          # 생긴 뒤 내려받기가 일시 실패하면 N -> 0이 되어 그때 잡는다.
          #
          # 이 가드가 못 잡는 것: sch_hit은 레벨 루프 밖에서 오르므로(school_join.py)
          # 초등만 수집되고 중·고·대가 빠진 schools.json이면 수는 그대로인데 세 열만
          # 사라진다. 막으려면 index.json에 레벨 목록도 남겨 비교해야 한다. 지금은
          # 자산 자체가 없어 살아 있는 표면이 0이라, 활용신청이 승인될 때 같이 본다.
          sch_now=$(python -c "import json;print(json.load(open('units/index.json')).get('sch_hit', -1))")
          echo "서울·경기 학교 결합 직전 ${SCH_WAS}개 -> 새 ${sch_now}개"
          if [ "$SCH_WAS" -gt 0 ] && [ "$sch_now" -eq 0 ]; then
            echo "학교 결합이 통째로 사라졌습니다. 발행을 거부합니다."
            exit 1
          fi

          tar -czf units.tar.gz -C units .
          ls -lh units.tar.gz
          gh release upload "$SNAPSHOT_TAG" units.tar.gz --clobber
          echo "done=true" >> "$GITHUB_OUTPUT"

      # 릴리스만 갱신하면 화면은 그대로다. Vercel은 코드 푸시가 없으면 릴리스가
      # 바뀐 것을 모르고, 화면 데이터는 빌드 때 fetch-data.mjs가 받아 굽는다.
      # 훅을 안 부르면 "릴리스는 매일 신선한데 화면은 여전히 주간"이 된다.
      - name: Vercel 재배포 훅 호출
        if: steps.rejoin.outputs.done == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK 미설정. 새 데이터는 다음 코드 푸시 때 반영됩니다."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 5 -X POST -o /dev/null "$DEPLOY_HOOK"
          echo "Vercel 재배포를 요청했습니다."

      # always()가 필요하다. 뒤에 붙은 재조인 스텝이 발행 가드로 exit 1 하면 잡이
      # 실패 상태가 되어, 암묵 success()에 걸려 이 진단이 안 찍힌다. 수집이 왜
      # 실패했는지가 재조인 결과에 가려지면 다음 날 판단이 헤맨다.
      - name: 수집 실패 여부 확인
        if: ${{ !cancelled() && steps.collect.outcome == 'failure' }}
        run: |
          echo "수집 단계가 실패했습니다. 위 로그를 확인하세요."
          echo "받은 만큼은 릴리스에 남아 있으므로 재실행하면 이어받습니다."
          exit 1
