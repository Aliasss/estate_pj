# 당월 조회 정찰 (일회성, todo #32).
#
# 릴리스 자산을 안 만지므로 data-latest concurrency 그룹에 넣지 않는다.
# 6번만 두드리므로 쿼터에도 영향이 없다.
# 결론이 나면 이 워크플로와 probe_ym.py는 지워도 된다.

name: 당월 조회 정찰

on:
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: '1'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # 이 잡은 git push를 안 한다. gh는 스텝마다 명시한 GH_TOKEN으로
          # 돈다. 기본값 true면 쓰기 토큰이 .git/config에 남아 이후 모든
          # 스텝이 읽을 수 있으므로, 시크릿을 스텝으로 내린 이득이 상쇄된다.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python probe_ym.py
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
