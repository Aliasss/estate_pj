# 위반건축물 필드 정찰 (일회성, todo #20).
#
# 릴리스 자산을 만지지 않으므로 data-latest concurrency 그룹에 넣지 않는다.
# sources.yml에 태우면 350분 그룹을 물어 대장 크론을 밀 수 있어서 따로 뒀다.
# 결론이 나면 이 워크플로와 probe_viol.py는 지워도 된다.

name: 위반건축물 필드 정찰

on:
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: '1'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # 이 잡은 git push를 안 한다. gh는 스텝마다 명시한 GH_TOKEN으로
          # 돈다. 기본값 true면 쓰기 토큰이 .git/config에 남아 이후 모든
          # 스텝이 읽을 수 있으므로, 시크릿을 스텝으로 내린 이득이 상쇄된다.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python probe_viol.py
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
