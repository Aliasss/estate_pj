# 위반건축물 필드 정찰 (일회성, todo #20).
#
# 릴리스 자산을 만지지 않으므로 data-latest concurrency 그룹에 넣지 않는다.
# sources.yml에 태우면 350분 그룹을 물어 대장 크론을 밀 수 있어서 따로 뒀다.
# 결론이 나면 이 워크플로와 probe_viol.py는 지워도 된다.

name: 위반건축물 필드 정찰

on:
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: '1'
  MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python probe_viol.py
