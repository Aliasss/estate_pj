# 좌표·지하철 자료원 정찰. 1분이면 끝나고 아무것도 저장하지 않는다.
#
# 개발 샌드박스에서는 한국 공공데이터 호스트가 전부 막혀 있어서 어떤 API가
# 살아 있는지 확인할 방법이 없다. 그래서 러너에서 대신 두드려 보고 결과만 읽는다.

name: 자료원 정찰

on:
  workflow_dispatch:
    inputs:
      geo_calls:
        description: '이번 실행 지오코딩 최대 건수'
        default: '30000'

env:
  PYTHONUNBUFFERED: '1'
  MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
  # 아직 없으면 해당 후보는 건너뛴다. 있으면 같이 확인한다.
  VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
  JUSO_CONFM_KEY: ${{ secrets.JUSO_CONFM_KEY }}
  SEOUL_OPENAPI_KEY: ${{ secrets.SEOUL_OPENAPI_KEY }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python probe_sources.py

      # 키가 들어오면 여기서 바로 지하철을 굽는다. 없으면 조용히 건너뛴다.
      - name: 지하철역 수집 (SEOUL_OPENAPI_KEY 있을 때만)
        if: ${{ env.SEOUL_OPENAPI_KEY != '' }}
        run: |
          python collect_subway.py --out subway.json
          gh release upload data-latest subway.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 지오코딩은 48,226건이라 하루에 다 못 받을 수 있다. 진행분을 릴리스에 남겨
      # 다음 실행이 이어받는다. 건축물대장과 같은 방식이다.
      - name: 좌표 수집 (VWORLD_KEY 있을 때만)
        if: ${{ env.VWORLD_KEY != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download data-latest --pattern 'units.tar.gz' --clobber
          mkdir -p units && tar -xzf units.tar.gz -C units
          # "에셋이 정말 없음"과 "다운로드 실패"를 구분한다. 일시 오류를 처음부터로
          # 삼키면 며칠치 좌표 진행분이 이번 실행분으로 덮여 갈려 나간다.
          assets=$(gh release view data-latest --json assets --jq '.assets[].name')
          if echo "$assets" | grep -qx 'geo.sqlite.gz'; then
            # 에셋이 분명히 있다. 여기서 실패하면 일시 오류이므로 중단한다.
            gh release download data-latest --pattern 'geo.sqlite.gz' --clobber
            gunzip -f geo.sqlite.gz
            sqlite3 geo.sqlite "SELECT COUNT(*) FROM coords" > .rows_before
          else
            echo "이전 진행분 없음. 처음부터 받습니다."
            echo 0 > .rows_before
          fi
          python geocode.py --units units --db geo.sqlite \
            --max-calls ${{ inputs.geo_calls || 30000 }} --rate 8 --workers 4

      - name: 좌표 진행분 발행
        if: ${{ always() && env.VWORLD_KEY != '' && hashFiles('geo.sqlite') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 행 수 가드: 복원 시점보다 줄어든 DB로 진행분을 덮어쓰지 않는다.
          # 복원이 실패했으면 .rows_before가 없고, 그때도 발행하지 않는다.
          if [ ! -f .rows_before ]; then
            echo "복원 기준(.rows_before)이 없습니다. 복원 단계가 깨진 채 왔으므로 발행하지 않습니다."
            exit 1
          fi
          before=$(cat .rows_before)
          after=$(sqlite3 geo.sqlite "SELECT COUNT(*) FROM coords")
          if [ "$after" -lt "$before" ]; then
            echo "coords 행 수가 ${before} -> ${after}로 줄었습니다. 발행을 거부합니다."
            exit 1
          fi
          echo "행 수 가드 통과: ${before} -> ${after}"
          python -c "import sqlite3;c=sqlite3.connect('geo.sqlite');c.execute('PRAGMA wal_checkpoint(TRUNCATE)');c.close()"
          gzip -kf geo.sqlite
          ls -lh geo.sqlite.gz
          gh release upload data-latest geo.sqlite.gz --clobber
