# 좌표·지하철·학교 갱신. 정찰로 시작한 워크플로라 파일 이름이 sources지만,
# 지금은 이 셋을 실제로 받아 오는 것이 본체다.
#
# 개발 샌드박스에서는 한국 공공데이터 호스트가 전부 막혀 있어서 어떤 API가
# 살아 있는지 확인할 방법이 없다. 그래서 러너에서 대신 두드려 보고 결과만 읽는다.
# 정찰만 하던 시절에는 1분이면 끝났지만, 지금은 키가 있으면 지하철·학교·좌표를
# 이어서 받는다. 좌표 3만 건은 실측으로 4시간을 넘긴다.
#
# 2026-08-30에 주간 크론을 붙였다. 그전까지 dispatch 전용이라 사람이 누를 때만
# 돌았는데, 실거래는 매주 새 지번을 들여온다. 8/26 갱신 한 번에 대장 조회 대상이
# 34,179에서 35,996으로 1,817지번 늘었다. 그 지번들은 좌표가 없어 지도·통근·
# 학교·지형이 통째로 빈 채로 화면에 나간다. 받을 수 있는 자료를 사람이 기억해야
# 최신이 되는 구조 자체가 결함이었다.

name: 자료원 갱신 (좌표·지하철·학교)

on:
  schedule:
    # 수요일 04:17 UTC = 13:17 KST. 요일과 분 둘 다 근거가 있다.
    #
    # 요일: 월 21:00 UTC collect가 최장 350분이라 화 03:20 UTC까지 갈 수 있다.
    # 같은 data-latest 그룹이라 겹치면 뒤에 선다. 화요일은 아슬아슬해서 수요일에
    # 둔다. 그러면 월요일 밤 collect가 들여온 새 지번을 이 회차가 본다.
    #
    # 시각: 이 잡이 최장 350분을 물어도 10:07 UTC에 끝나 buildings(13:07 UTC)를
    # 안 민다. 실제로는 좌표가 완주 상태라 증분만 받아 훨씬 짧다.
    #
    # 분: 정각을 피한다. 깃허브 예약 실행이 정각에 몰린 큐에서 밀리거나 통째로
    # 버려지는 것을 8/15~8/28에 실측했다(buildings.yml의 이력 참고).
    - cron: '17 4 * * 3'
  workflow_dispatch:
    inputs:
      geo_calls:
        description: '이번 실행 지오코딩 최대 건수'
        default: '30000'

# collect·buildings와 같은 릴리스 자산(units.tar.gz, geo.sqlite.gz)을 --clobber로
# 만진다. 겹치면 한쪽의 삭제 후 재업로드 창에 다른 쪽 다운로드가 걸려 깨지므로
# 같은 그룹으로 직렬화한다. 이 블록이 없어서 재빌드와 좌표 수집이 21초 차이로
# 동시에 시작한 적이 있다(2026-08-17).
#
# 대가가 있다. 이 잡은 최대 350분 그룹을 붙잡는데, buildings는 매일 13:07 UTC에
# 돈다. 그 시간을 물면 대장 수집이 통째로 밀린다. 최대 350분을 물리면 시작이
# KST 오전으로 넘어가는데, 09시대는 8/13·8/14 이틀 연속 ConnectTimeout으로
# 실측 탈락한 창이다. 그러면 그날 하루치를 통째로 버린다. 게다가 그룹당
# 대기 슬롯은 하나뿐이라, 대기 중인 run이 있는데 새로 디스패치하면 먼저 기다리던
# 쪽이 조용히 취소된다. 좌표를 여러 회차로 이어 받을 때는 13:07~19:00 UTC를 피하고,
# (예약 13:07이지만 실제 시작이 20~43분 늦고 최장 실행이 5시간 15분이다)
# 회차 사이에 buildings가 실제로 돌았는지 확인할 것.
concurrency:
  group: data-latest
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  probe:
    runs-on: ubuntu-latest
    # 정찰 시절의 10분이 남아 있다가 좌표 수집을 10분 만에 자르는 사고가 있었다.
    # 좌표 3만 건이 초당 2건 꼴로 4시간대이므로, collect와 같은 여유를 준다.
    timeout-minutes: 350
    permissions:
      contents: write
    # 키 게이트.
    #
    # 시크릿을 워크플로 레벨 env에 두면 체크아웃과 pip install을 포함한 이 잡의
    # 모든 스텝이 값을 들고 돈다. 그래서 값은 그것을 읽는 스텝에만 내렸는데,
    # 아래 세 수집의 if 조건이 바로 그 워크플로 레벨 env를 읽고 있었다. 값을
    # 내리면 조건이 빈 문자열이 되어 셋이 통째로, 그것도 조용히 스킵된다.
    #
    # secrets 컨텍스트는 스텝 if에서는 못 쓰지만 여기(jobs.<id>.env)서는 쓸 수
    # 있다. 그래서 값이 아니라 "있다/없다"만 잡 레벨에 둔다. 어느 스텝에도
    # 실리는 것은 문자열 true/false뿐이고, 게이트는 스텝 if가 읽을 수 있는
    # env로 남는다.
    env:
      HAS_SUBWAY: ${{ secrets.SEOUL_OPENAPI_KEY != '' }}
      HAS_SCHOOLS: ${{ secrets.MOLIT_SERVICE_KEY != '' }}
      HAS_GEO: ${{ secrets.JUSO_CONFM_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 이 잡은 git push를 안 한다. gh는 스텝마다 명시한 GH_TOKEN으로
          # 돈다. 기본값 true면 쓰기 토큰이 .git/config에 남아 이후 모든
          # 스텝이 읽을 수 있으므로, 시크릿을 스텝으로 내린 이득이 상쇄된다.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      # 정찰은 진단이라 실패해도 수집을 막지 않는다. return 2로 끝나는 경로가
      # 있어서(키 없음 등) 여기서 잡이 죽으면 좌표 수집이 시작조차 못 한다.
      # 예약 회차에서는 건너뛴다. 사람이 읽지 않는 진단은 호출만 쓴다.
      - run: python probe_sources.py
        if: ${{ github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
          JUSO_CONFM_KEY: ${{ secrets.JUSO_CONFM_KEY }}
          # VWorld는 해외 IP 차단을 실측하고 폐기했다. 이 정찰만 후보로 두드린다.
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}

      # 키가 들어오면 여기서 바로 지하철을 굽는다. 없으면 건너뛰고 요약이 경고한다.
      #
      # continue-on-error가 필요한 이유: 서울 오픈API가 간헐적으로 응답하지
      # 않는다. 실측(2026-08-17)으로 ConnectTimeout 한 번에 이 잡이 2분 만에
      # 죽어서, 정작 본체인 좌표 수집이 시작조차 못 했다. 지하철과 좌표는 아무
      # 관계가 없고, 지하철은 654역으로 이미 완성돼 릴리스에 있다. 못 받으면
      # 이전 것을 쓰고 넘어가는 것이 맞다.
      - name: 지하철역 수집 (SEOUL_OPENAPI_KEY 있을 때만)
        id: subway
        if: env.HAS_SUBWAY == 'true'
        continue-on-error: true
        run: |
          python collect_subway.py --out subway.json
          gh release upload data-latest subway.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEOUL_OPENAPI_KEY: ${{ secrets.SEOUL_OPENAPI_KEY }}

      # 학교 위치. 실거래가와 같은 계정 키지만 활용신청은 데이터셋마다 따로라,
      # 신청 전에는 여기서 오류가 난다. 승인되면 다음 실행부터 조용히 켜진다.
      - name: 학교 위치 수집 (MOLIT_SERVICE_KEY 있을 때만)
        id: schools
        if: env.HAS_SCHOOLS == 'true'
        continue-on-error: true
        run: |
          python collect_schools.py --out schools.json
          gh release upload data-latest schools.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
          JUSO_CONFM_KEY: ${{ secrets.JUSO_CONFM_KEY }}
          JUSO_SEARCH_KEY: ${{ secrets.JUSO_SEARCH_KEY }}

      # 지오코딩은 48,226건이라 하루에 다 못 받을 수 있다. 진행분을 릴리스에 남겨
      # 다음 실행이 이어받는다. 건축물대장과 같은 방식이다.
      - name: 좌표 수집 (JUSO_CONFM_KEY 있을 때만)
        id: geo
        if: env.HAS_GEO == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JUSO_CONFM_KEY: ${{ secrets.JUSO_CONFM_KEY }}
          JUSO_SEARCH_KEY: ${{ secrets.JUSO_SEARCH_KEY }}
        run: |
          gh release download data-latest --pattern 'units.tar.gz' --clobber
          mkdir -p units && tar -xzf units.tar.gz -C units
          # "에셋이 정말 없음"과 "다운로드 실패"를 구분한다. 일시 오류를 처음부터로
          # 삼키면 며칠치 좌표 진행분이 이번 실행분으로 덮여 갈려 나간다.
          assets=$(gh release view data-latest --json assets --jq '.assets[].name')
          if echo "$assets" | grep -qx 'geo.sqlite.gz'; then
            # 에셋이 분명히 있다. 여기서 실패하면 일시 오류이므로 중단한다.
            gh release download data-latest --pattern 'geo.sqlite.gz' --clobber
            gunzip -f geo.sqlite.gz
            # 리다이렉트를 먼저 쓰면 sqlite3가 실패해도 0바이트 파일이 남는다.
            # 그러면 아래 발행의 "파일 없음" 검사를 통과하고, 빈 문자열과 비교하는
            # 행 수 가드가 정수 오류로 거짓이 되어 소리 없이 사라진다.
            before=$(sqlite3 geo.sqlite "SELECT COUNT(*) FROM coords")
            [ -n "$before" ] || { echo "복원한 DB에서 행 수를 못 읽었습니다"; exit 1; }
            echo "$before" > .rows_before
          else
            echo "이전 진행분 없음. 처음부터 받습니다."
            echo 0 > .rows_before
          fi
          python geocode.py --units units --db geo.sqlite \
            --max-calls ${{ inputs.geo_calls || 30000 }} --rate 8 --workers 4

      # 표고 계산 전에 지하철 자료를 릴리스 기준으로 맞춘다.
      #
      # station_elev는 좌표 배열의 위치 인덱스만 키로 쓰는데(collect_dem.py),
      # 소비하는 쪽(build_units)은 릴리스의 subway.json으로 그 인덱스를 만든다.
      # 그래서 이 러너의 파일이 릴리스와 다르면 역이 하나만 늘어도 뒤 인덱스가
      # 통째로 밀려, stn_dh가 "없음"이 아니라 다른 역의 표고로 계산된 그럴듯한
      # 숫자가 된다. 화면에는 "역보다 약 N m 높음"으로 그대로 나간다.
      #
      # 위 수집 스텝은 수집과 업로드가 한 묶음이라, 수집만 되고 업로드가 실패하면
      # 정확히 그 어긋남이 생긴다. 그래서 무엇을 받았든 여기서 릴리스 것으로 다시
      # 맞춘다. 못 맞추면 파일을 지워 역 표고 계산을 건너뛴다. 그때는 이전
      # station_elev가 그대로 남는데, 릴리스도 그대로이므로 짝은 맞다.
      - name: 지하철 자료를 릴리스 기준으로 맞춤
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f subway.json
          # 다운로드가 중간에 끊기면 잘린 JSON이 남는다. 파싱과 역 수까지 봐야
          # "받았다"고 할 수 있다. 현재 654역이라 500을 절단 감지선으로 둔다.
          if gh release download data-latest --pattern 'subway.json' --clobber \
             && python -c "import json,sys; n=len(json.load(open('subway.json'))['stations']); print(f'역 {n}개'); sys.exit(0 if n >= 500 else 1)"; then
            echo "릴리스 subway.json 기준으로 맞췄습니다"
          else
            echo "::warning::릴리스 subway.json을 확보하지 못했습니다. 역 표고 계산을 건너뜁니다"
            rm -f subway.json
          fi

      # 지형. 좌표가 새로 생긴 지번만 계산해 geo.sqlite에 붙이고, 아래 발행이
      # 같이 실어 간다. 타일은 s3(키 불요)이고 지형은 안 변하므로 증분이 짧다.
      - name: 표고·경사 계산 (좌표 있을 때만)
        if: ${{ always() && hashFiles('geo.sqlite') != '' }}
        continue-on-error: true
        run: python collect_dem.py --db geo.sqlite --subway subway.json

      - name: 좌표 진행분 발행
        if: ${{ always() && hashFiles('geo.sqlite') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 행 수 가드: 복원 시점보다 줄어든 DB로 진행분을 덮어쓰지 않는다.
          # 복원이 실패했으면 .rows_before가 없고, 그때도 발행하지 않는다.
          if [ ! -f .rows_before ]; then
            echo "복원 기준(.rows_before)이 없습니다. 복원 단계가 깨진 채 왔으므로 발행하지 않습니다."
            exit 1
          fi
          before=$(cat .rows_before)
          case "$before" in
            ''|*[!0-9]*) echo "복원 기준이 숫자가 아닙니다(\"$before\"). 발행하지 않습니다."; exit 1 ;;
          esac
          after=$(sqlite3 geo.sqlite "SELECT COUNT(*) FROM coords")
          if [ "$after" -lt "$before" ]; then
            echo "coords 행 수가 ${before} -> ${after}로 줄었습니다. 발행을 거부합니다."
            exit 1
          fi
          echo "행 수 가드 통과: ${before} -> ${after}"
          python -c "import sqlite3;c=sqlite3.connect('geo.sqlite');c.execute('PRAGMA wal_checkpoint(TRUNCATE)');c.close()"
          gzip -kf geo.sqlite
          ls -lh geo.sqlite.gz
          gh release upload data-latest geo.sqlite.gz --clobber

      # 예약 회차가 조용히 실패하면 사람은 몇 주 뒤에야 안다. 세 수집이 전부
      # continue-on-error라 잡은 늘 초록이었다. 결과를 한 줄로 찍고, 본체인
      # 좌표가 실패한 회차만 빨간불로 만든다.
      #
      # 지하철과 학교는 경고로 끝낸다. 서울 오픈API가 간헐적으로 죽는 것이
      # 실측돼 있고(2026-08-17 ConnectTimeout), 지하철은 654역으로 이미 완성돼
      # 릴리스에 있어 못 받으면 이전 것을 쓰면 된다. 그걸로 매주 빨간불을
      # 띄우면 경보가 무뎌져서, 정작 좌표가 죽은 주를 놓친다.
      #
      # outcome 값은 깃허브가 주는 고정 낱말(success/failure/skipped/cancelled)
      # 이지만, 셸에 직접 펴 넣지 않고 env로 받는 규율을 지킨다.
      #
      # `[ 조건 ] && echo`가 아니라 if 블록을 쓴다. 깃허브는 `bash -e`로 돌리는데,
      # 조건이 거짓이면 그 줄의 종료 코드가 1이 된다. AND-OR 목록의 마지막이
      # 아닌 명령은 -e가 무시하도록 정해져 있어 실제로는 안 죽는 것을 확인했지만,
      # 잡을 죽이느냐가 규칙의 미묘한 구석에 걸리는 코드는 다음 사람이 읽다가
      # 헷갈린다. 여기는 실패를 판정하는 자리라 헷갈릴 값이 없다.
      - name: 갱신 결과 요약
        if: ${{ always() }}
        env:
          SUBWAY: ${{ steps.subway.outcome }}
          SCHOOLS: ${{ steps.schools.outcome }}
          GEO: ${{ steps.geo.outcome }}
        run: |
          echo "지하철 ${SUBWAY:-미실행} · 학교 ${SCHOOLS:-미실행} · 좌표 ${GEO:-미실행}"
          # 키가 없어 건너뛴 것은 outcome이 skipped라 아래 failure 판정에 안
          # 걸린다. 여기서 따로 잡지 않으면 그 회차가 조용히 초록으로 끝난다.
          if [ "$HAS_SUBWAY" != true ]; then
            echo "::warning::SEOUL_OPENAPI_KEY가 없어 지하철역 수집을 건너뛰었습니다. 이전 자료를 그대로 씁니다."
          fi
          if [ "$HAS_SCHOOLS" != true ]; then
            echo "::warning::MOLIT_SERVICE_KEY가 없어 학교 위치 수집을 건너뛰었습니다. 이전 자료를 그대로 씁니다."
          fi
          if [ "$HAS_GEO" != true ]; then
            echo "::error::JUSO_CONFM_KEY가 없어 좌표 수집을 건너뛰었습니다. 새 지번이 지도·통근·학교·지형에서 계속 빕니다."
            exit 1
          fi
          if [ "$SUBWAY" = failure ]; then
            echo "::warning::지하철역 수집이 실패했습니다. 이전 자료를 그대로 씁니다."
          fi
          if [ "$SCHOOLS" = failure ]; then
            echo "::warning::학교 위치 수집이 실패했습니다. 이전 자료를 그대로 씁니다."
          fi
          if [ "$GEO" = failure ]; then
            echo "::error::좌표 수집이 실패했습니다. 이번 주 새 지번은 지도·통근·학교·지형이 빈 채로 남습니다."
            exit 1
          fi
