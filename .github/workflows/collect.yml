# 서울 부동산 실거래가 수집 → 집계 → 리포지토리 커밋 + 릴리스 스냅샷
# Secrets: MOLIT_SERVICE_KEY
#
# 데이터가 남는 곳 세 군데:
#   data/*.csv           집계 패널. 리포지토리에 커밋되어 영구 보존 + 월별 변화 추적
#   릴리스 data-latest   원본 SQLite(gzip). 만료 없음. 다음 실행이 여기서 이어받는다
#   아티팩트             집계 CSV. 30일 보관. 웹에서 바로 받을 때 편의용
#
# Actions 캐시는 7일 미접근 시 삭제되는데 스케줄은 30일 간격이라 항상 만료된 뒤에
# 돌게 된다. 그래서 캐시 대신 릴리스 자산을 이어받기 저장소로 쓴다.

name: 서울 실거래가 수집

on:
  schedule:
    # 매주 월요일 21:00 UTC = 화요일 06:00 KST. 신고는 매일 쌓이는데 월 1회면
    # 월말로 갈수록 원본이 최대 4주 낡는다. 주간 + 최근 3개월 재수집(--refresh-recent
    # 기본 3)이면 호출 300건 수준으로 신선도가 7일 이내로 유지된다.
    - cron: '0 21 * * 1'
  workflow_dispatch:
    inputs:
      refresh_recent:
        description: '최근 N개월 강제 재수집'
        default: '3'
      rates_probe:
        description: 'ECOS 항목 코드 탐색. 121Y002 같은 통계표 코드를 넣으면 그 표의 항목 목록만 출력'
        default: ''
      skip_collect:
        description: '수집을 건너뛰고 스냅샷으로 집계·패널만 다시 만든다 (집계 코드만 고쳤을 때)'
        type: boolean
        default: false

# 동시 실행되면 릴리스 자산과 커밋이 서로 덮어쓴다. buildings.yml과 같은
# 그룹을 써서 두 워크플로도 직렬화한다. 서로 같은 data-latest 릴리스를 만지므로,
# 겹치면 한쪽의 --clobber(삭제 후 재업로드) 창에 다른 쪽 다운로드가 걸려 깨진다.
concurrency:
  group: data-latest
  cancel-in-progress: false

env:
  # 이게 없으면 파이썬 stdout이 블록 버퍼링돼서 실행 중 로그가 안 보인다.
  # 인구 백필 첫 실행을 두 시간 동안 깜깜이로 지켜본 원인이 이것이었다.
  PYTHONUNBUFFERED: '1'
  MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SNAPSHOT_TAG: data-latest

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # 첫 백필(실거래·인구) 여유. 인구 2,520호출이 지연 4.5초면 195분
    permissions:
      contents: write   # data/ 커밋 + 릴리스 자산 업로드

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 이전 실행이 남긴 원본을 받아온다. "에셋이 정말 없음"(최초 실행)과
      # "다운로드 실패"(GitHub API 일시 오류)를 구분한다. 후자를 처음부터 수집으로
      # 삼키면 5년치 스냅샷이 한 달치로 조용히 갈려 나간다.
      - name: 직전 스냅샷 복원
        run: |
          # '없음' 판정은 세 번 확인한다. GitHub API가 존재하는 릴리스에 일시적으로
          # 404를 주는 드문 경우를 '최초 실행'으로 오판하면, 빈 DB에서 시작한 부분
          # 수집본이 행 수 가드(기준 0)를 통과해 5년치 스냅샷을 덮어쓴다.
          view_release() { gh release view "$SNAPSHOT_TAG" --json assets --jq '.assets[].name' 2>&1; }
          found=""
          for attempt in 1 2 3; do
            if assets=$(view_release); then found=yes; break; fi
            if echo "$assets" | grep -qiE 'not found|404'; then
              found=no
              # 간격 30초. GitHub 장애는 분 단위로 가는 일이 있어, 10초 세 번으로는
              # 같은 장애 창 안에서 세 번 다 속을 수 있다. 진짜 최초 실행의 비용은 60초뿐.
              [ "$attempt" -lt 3 ] && sleep 30
            else
              echo "릴리스 확인 자체가 실패했습니다. 일시 오류를 '처음부터'로 오판하지 않도록 중단합니다."
              echo "$assets"
              exit 1
            fi
          done
          if [ "$found" = yes ]; then
            if echo "$assets" | grep -qx 'seoul_rt.sqlite.gz'; then
              # 에셋이 분명히 있다. 여기서 실패하면 일시 오류이므로 중단한다.
              gh release download "$SNAPSHOT_TAG" --pattern 'seoul_rt.sqlite.gz' --clobber
              gunzip -f seoul_rt.sqlite.gz
              python -c "import sqlite3;c=sqlite3.connect('seoul_rt.sqlite');print('복원됨:', c.execute('SELECT COUNT(*) FROM transactions').fetchone()[0], '건');c.close()"
            else
              echo "릴리스는 있지만 seoul_rt.sqlite.gz 에셋이 없음. 처음부터 수집합니다."
            fi
          else
            echo "이전 스냅샷 없음(3회 확인, 최초 실행). 5년치를 처음부터 수집합니다."
          fi
          # 발행 스텝의 행 수 가드 기준. 복원이 없으면 0에서 시작한다.
          if [ -f seoul_rt.sqlite ]; then
            sqlite3 seoul_rt.sqlite "SELECT COUNT(*) FROM transactions" > .rows_before
          else
            echo 0 > .rows_before
          fi

      - name: 실거래가 수집
        id: collect
        if: ${{ !inputs.skip_collect }}
        continue-on-error: true
        env:
          # dispatch 입력은 env를 거쳐 셸에 준다. 직접 보간은 인젝션 표면이다.
          IN_REFRESH: ${{ inputs.refresh_recent }}
        run: python collect.py --db seoul_rt.sqlite --refresh-recent "${IN_REFRESH:-3}"

      # 수집이 중간에 깨져도 받은 만큼은 보존해야 다음 실행이 이어받는다.
      # 건너뛴 경우엔 원본이 그대로라 다시 올릴 게 없다(2.2GB 왕복을 아낀다).
      - name: 원본 스냅샷 발행
        if: ${{ always() && !inputs.skip_collect && hashFiles('seoul_rt.sqlite') != '' }}
        run: |
          # 행 수 가드: 복원 시점보다 줄어든 DB로 스냅샷을 덮어쓰지 않는다.
          # 스냅샷은 다음 실행의 이어받기 기반이라, 한 번 줄면 되돌릴 길이 없다.
          if [ ! -f .rows_before ]; then
            echo "복원 기준(.rows_before)이 없습니다. 복원 단계가 깨진 채 왔으므로 발행하지 않습니다."
            exit 1
          fi
          before=$(cat .rows_before)
          after=$(sqlite3 seoul_rt.sqlite "SELECT COUNT(*) FROM transactions")
          if [ "$after" -lt "$before" ]; then
            echo "transactions 행 수가 ${before} -> ${after}로 줄었습니다. 발행을 거부합니다."
            exit 1
          fi
          echo "행 수 가드 통과: ${before} -> ${after}"
          # WAL을 본체에 합쳐야 파일 하나로 온전해진다.
          python -c "import sqlite3;c=sqlite3.connect('seoul_rt.sqlite');c.execute('PRAGMA wal_checkpoint(TRUNCATE)');c.close()"
          gzip -kf seoul_rt.sqlite
          ls -lh seoul_rt.sqlite.gz
          gh release view "$SNAPSHOT_TAG" >/dev/null 2>&1 || \
            gh release create "$SNAPSHOT_TAG" --title "실거래가 원본 스냅샷" \
              --notes "국토교통부 실거래가 원본 SQLite. 매 수집 실행마다 갱신된다. gunzip 후 sqlite3로 열면 된다."
          gh release upload "$SNAPSHOT_TAG" seoul_rt.sqlite.gz --clobber

      # 여기부터는 배포 체인이다. 수집이 "신뢰 불가"(exit 1)로 끝났으면 태우지
      # 않는다. 스냅샷 보존(위)은 이어받기를 위해 필요하지만, 오류율 20% 초과나
      # 절단이 의심되는 데이터를 집계해 프로덕션에 내보내는 것은 다른 문제다.
      # skip_collect(집계만 재생성)일 때는 수집 스텝이 skipped라 조건으로 살린다.

      # 건축물대장은 buildings.yml이 매일 조금씩 채운다. 에셋이 정말 없으면 해당 열만
      # 비고 나머지는 그대로 나온다. 있는데 못 받은 것은 일시 오류이므로, 열이 빈 채
      # 조용히 발행되지 않도록 중단한다.
      - name: 건축물대장 복원
        if: ${{ inputs.skip_collect || steps.collect.outcome == 'success' }}
        run: |
          if ! assets=$(gh release view "$SNAPSHOT_TAG" --json assets --jq '.assets[].name' 2>&1); then
            if echo "$assets" | grep -qiE 'not found|404'; then
              echo "릴리스 없음(최초 실행). 건축물대장 없이 생성합니다."
              exit 0
            fi
            echo "릴리스 확인 실패:"; echo "$assets"; exit 1
          fi
          if echo "$assets" | grep -qx 'bldg.sqlite.gz'; then
            gh release download "$SNAPSHOT_TAG" --pattern 'bldg.sqlite.gz' --clobber
            gunzip -f bldg.sqlite.gz
            python -c "import sqlite3;c=sqlite3.connect('bldg.sqlite');print('건축물대장', c.execute('SELECT COUNT(*) FROM buildings').fetchone()[0], '동')"
          else
            echo "건축물대장 없음. 해당 열 없이 생성합니다."
          fi

      # 좌표·지하철도 릴리스에서 받아 온다. 위와 같은 규율: 정말 없을 때만 비운다.
      - name: 좌표·지하철 복원
        if: ${{ inputs.skip_collect || steps.collect.outcome == 'success' }}
        run: |
          if ! assets=$(gh release view "$SNAPSHOT_TAG" --json assets --jq '.assets[].name' 2>&1); then
            if echo "$assets" | grep -qiE 'not found|404'; then
              echo "릴리스 없음(최초 실행). 좌표·지하철 없이 생성합니다."
              exit 0
            fi
            echo "릴리스 확인 실패:"; echo "$assets"; exit 1
          fi
          if echo "$assets" | grep -qx 'geo.sqlite.gz'; then
            gh release download "$SNAPSHOT_TAG" --pattern 'geo.sqlite.gz' --clobber
            gunzip -f geo.sqlite.gz
            python -c "import sqlite3;c=sqlite3.connect('geo.sqlite');print('좌표', c.execute(\"SELECT COUNT(*) FROM coords WHERE status='ok'\").fetchone()[0], '건')"
          else
            echo "좌표 없음."
          fi
          if echo "$assets" | grep -qx 'subway.json'; then
            gh release download "$SNAPSHOT_TAG" --pattern 'subway.json' --clobber
          else
            echo "지하철 없음."
          fi

      - name: 금리 시계열 수집 (ECOS)
        if: ${{ inputs.skip_collect || steps.collect.outcome == 'success' }}
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          IN_RATES_PROBE: ${{ inputs.rates_probe }}
        run: |
          if [ -z "$ECOS_API_KEY" ]; then
            echo "ECOS_API_KEY 미설정. ecos.bok.or.kr에서 무료 발급 후 시크릿에 넣으면"
            echo "전월세 전환율 판정에 금리 비교가, 시세 탭에 기준금리 차트가 켜집니다."
          elif [ -n "$IN_RATES_PROBE" ]; then
            python collect_rates.py --probe "$IN_RATES_PROBE"
          else
            # 부가 지표의 일시 장애가 실거래 갱신 전체를 볼모로 잡으면 안 된다.
            # 실패하면 리포지토리에 커밋된 기존 rates.json이 그대로 쓰인다.
            python collect_rates.py --out data/rates.json \
              || echo "::warning::금리 갱신 실패. 기존 rates.json을 유지합니다."
          fi

      # 세대수 추이(시세 탭). 부가 지표라 ECOS와 같은 규율: 실패해도 실거래
      # 갱신을 볼모로 잡지 않고, 리포지토리의 기존 pop.json이 그대로 쓰인다.
      # 같은 data.go.kr 키를 쓰지만 "법정동별 주민등록 인구 및 세대현황"
      # 활용신청(자동승인)이 따로 되어 있어야 한다.
      - name: 인구·세대 수집 (행안부)
        if: ${{ inputs.skip_collect || steps.collect.outcome == 'success' }}
        run: |
          python collect_pop.py --out data/pop.json \
            || echo "::warning::인구·세대 갱신 실패. 기존 pop.json을 유지합니다. 첫 실패라면 활용신청 여부와 로그의 응답 표본을 확인하세요."

      - name: 집계 패널 생성
        if: ${{ inputs.skip_collect || steps.collect.outcome == 'success' }}
        run: python aggregate.py --db seoul_rt.sqlite --csv-dir out

      # 물건 단위 패널은 10MB급이라 커밋하면 리포지토리가 매달 그만큼 불어난다.
      # 릴리스 자산으로 올리고 Vercel 빌드가 받아 정적 파일로 굽는다.
      - name: 물건 단위 패널 발행
        if: ${{ inputs.skip_collect || steps.collect.outcome == 'success' }}
        run: |
          python build_units.py --db seoul_rt.sqlite --out units \
            --bldg bldg.sqlite --geo geo.sqlite --subway subway.json
          tar -czf units.tar.gz -C units .
          ls -lh units.tar.gz
          gh release upload "$SNAPSHOT_TAG" units.tar.gz --clobber

      # 인사이트 이력. 이번 회차의 헤드라인 수치를 data/insights_history.json에
      # 남긴다(내용이 안 바뀌면 생략). 빌드와 같은 스크립트로 계산하므로 화면과
      # 이력이 갈라질 수 없다. 바로 아래 커밋 스텝의 git add data가 실어 간다.
      - name: 인사이트 이력 적재
        if: ${{ inputs.skip_collect || steps.collect.outcome == 'success' }}
        run: |
          # 스크립트는 data/*.csv를 읽는데 이번 회차 집계는 아직 out/에만 있다.
          # 먼저 복사하지 않으면 실거래 카드만 지난주 수치로 적재된다(세대 혼합).
          # 아래 커밋 스텝의 같은 cp는 멱등이라 그대로 둔다.
          mkdir -p data
          cp out/*.csv data/
          node web/scripts/fetch-data.mjs --append-history \
            || echo "::warning::인사이트 이력 적재 실패. 이력 없이 진행합니다."

      - name: 집계 CSV 커밋
        if: ${{ inputs.skip_collect || steps.collect.outcome == 'success' }}
        run: |
          mkdir -p data
          cp out/*.csv data/
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "집계 결과에 변화 없음. 커밋 생략."
          else
            git commit -m "데이터 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            # 잡 시작 후 수집에 몇 시간이 걸리므로 그 사이 코드 푸시가 있으면
            # non-fast-forward가 된다. data/만 만지니 rebase 충돌은 사실상 없다.
            # 여기서 실패한 채 넘어가면 릴리스(units)는 신세대, CSV는 구세대로
            # 갈린 채 다음 빌드에 실린다. 재시도 후에도 안 되면 빨간불로 남긴다.
            pushed=""
            for attempt in 1 2 3; do
              if git push; then pushed=yes; break; fi
              echo "push 실패 (${attempt}회). 원격 변경을 rebase 후 재시도합니다."
              sleep $((attempt * 5))
              git pull --rebase origin main
            done
            [ "$pushed" = yes ]
          fi

      # 새 데이터를 올렸으면 웹도 다시 구워야 한다. Vercel은 코드 푸시가 없으면
      # 릴리스가 갱신된 것을 모른다. 훅 URL은 시크릿이므로 절대 로그에 찍지 않는다.
      # 반드시 CSV 커밋 뒤에 부른다. 앞에 부르면 훅이 시작한 빌드가 커밋 직전
      # 리포지토리를 받아 가서, 시세 탭(tier1)이 한 사이클 묵은 채 배포된다.
      - name: Vercel 재배포 훅 호출
        if: ${{ inputs.skip_collect || steps.collect.outcome == 'success' }}
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK 미설정. 새 데이터는 다음 코드 푸시 때 반영됩니다."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 5 -X POST -o /dev/null "$DEPLOY_HOOK"
          echo "Vercel 재배포를 요청했습니다."

      - name: 집계 CSV 업로드
        if: ${{ inputs.skip_collect || steps.collect.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: seoul-realestate-panel
          path: out/*.csv
          retention-days: 30

      # 수집 단계 실패를 삼키지 않는다. 스냅샷은 이미 위에서 보존됐다.
      - name: 수집 실패 여부 확인
        if: steps.collect.outcome == 'failure'
        run: |
          echo "수집 단계가 실패했습니다. 위 로그에서 원인을 확인하세요."
          echo "받은 구간은 스냅샷에 남았으므로 재실행하면 이어받습니다."
          exit 1
